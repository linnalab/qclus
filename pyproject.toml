[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qclus"
version = "0.3.1.dev0"
description = "Droplet filtering for single-nucleus RNA-seq data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eloi Schmauch" },
    { name = "Johannes Ojanen", email = "johannes.ojanen@gmail.com" },
]
keywords = ["snRNA-seq", "single-nucleus RNA-seq", "quality control", "droplet filtering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10.7",
    "loompy>=3.0.6",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pysam>=0.22.1",
    "scanpy>=1.10.1",
    "scikit-learn>=1.5.0",
    "scrublet>=0.2.3",
    "tqdm>=4.66.4",
    "umap-learn>=0.5.5",
]

[project.optional-dependencies]
tutorials = ["igraph", "jupyterlab", "leidenalg", "matplotlib"]
test = ["pytest>=8"]

[project.scripts]
qclus = "qclus.cli:main"

[project.urls]
Homepage = "https://github.com/linnalab/qclus"
Issues = "https://github.com/linnalab/qclus/issues"
Changelog = "https://github.com/linnalab/qclus/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.1093/nar/gkae1145"

[tool.setuptools]
# Listed explicitly: automatic discovery would also pick up tutorials/.
packages = ["qclus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
